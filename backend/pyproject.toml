[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's `Depends(...)` in argument defaults is the idiomatic DI pattern.
# UP042: str+Enum (not enum.StrEnum) is used deliberately for Pydantic v2 + SQLAlchemy compatibility.
ignore = ["B008", "UP042"]

[tool.black]
line-length = 100
target-version = ["py311"]
